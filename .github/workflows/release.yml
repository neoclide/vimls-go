name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Determine release version
        id: vars
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Run checks and tests
        run: |
          go vet -mod=readonly ./...
          go test -mod=readonly -count=1 ./...

      - name: Build binaries, archives and CHANGELOG release notes
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          go run -mod=readonly ./tools/release -version "$TAG" -epoch "$(git log -1 --format=%ct)" \
            -output-dir "$RUNNER_TEMP/vimls-dist" -notes-output "$RUNNER_TEMP/vimls-release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/vimls-release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/vimls-dist/*
