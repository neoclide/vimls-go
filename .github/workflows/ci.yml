name: CI

env:
  GOFLAGS: -mod=readonly

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.26.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: make format-check test race vet build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: make format-check coverage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go vet ./...
      # The integration TestMain builds the server dynamically; Go's package
      # test cache does not track all of that subprocess's source inputs.
      - run: go test -count=1 ./...
      - run: go build ./...

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  vim-oracle:
    runs-on: ubuntu-latest
    env:
      VIMRUNTIME: ${{ github.workspace }}/.test-tools/vim/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: actions/checkout@v4
        with:
          repository: vim/vim
          ref: v9.2.1015
          path: .test-tools/vim
      - run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      - run: ./configure --with-features=huge --enable-gui=no --without-x && make -j2
        working-directory: .test-tools/vim
      - run: make oracle VIM_EXECUTABLE="$GITHUB_WORKSPACE/.test-tools/vim/src/vim"
      - run: make client-smoke VIM_EXECUTABLE="$GITHUB_WORKSPACE/.test-tools/vim/src/vim"
