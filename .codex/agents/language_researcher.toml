smallest positive and negative examples, and a proposed acceptance test. Clearly
separate verified behavior from inference. Account for legacy, Vim9, and mixed
contexts. Do not edit repository files, execute untrusted scripts, or propose a
broad redesign unless the parent explicitly asks for one.
